create_chore:
  name: Create chore
  description: >-
    Create a new Family Hub chore. Mirrors family_hub/chores/create on the
    websocket API - the same action the chore-creation form on
    family-hub-chores-card uses, available here for native HA automations,
    scripts, and voice assistants.
  fields:
    title:
      name: Title
      description: What the chore is called.
      required: true
      example: Take out the trash
      selector:
        text:
    assigned_to:
      name: Assigned to
      description: >-
        A Home Assistant user ID, or "chore_bin" to drop it straight into
        the shared Chore Bin unclaimed. Required for assignment_mode
        "direct"; ignored (and resolved automatically) for every other mode.
      required: false
      selector:
        text:
    assignment_mode:
      name: Assignment mode
      description: How this chore gets assigned to someone.
      required: false
      default: direct
      selector:
        select:
          options:
            - direct
            - chore_bin
            - auto_rotation
            - first_come_first_served
    rotation_group:
      name: Rotation group
      description: >-
        For assignment_mode "auto_rotation" only: the Home Assistant user
        IDs who take turns on this chore, in order.
      required: false
      selector:
        object:
    star_value:
      name: Star value
      description: Stars awarded to whoever completes and gets this chore approved.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    due_date:
      name: Due date
      description: ISO 8601 date/time this chore is due by.
      required: false
      selector:
        datetime:
    overdue_penalty:
      name: Overdue penalty
      description: Stars deducted (once) if this chore is still open past its due date.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    dependencies:
      name: Dependencies
      description: Chore IDs that must be approved before this one can be completed.
      required: false
      selector:
        object:

complete_chore:
  name: Complete chore
  description: >-
    Mark a chore done, entering pending verification. Mirrors
    family_hub/chores/complete on the websocket API.
  fields:
    chore_id:
      name: Chore
      description: The chore's id.
      required: true
      selector:
        text:

approve_chore:
  name: Approve chore
  description: >-
    Approve a pending-verification chore, disbursing its star value to
    whoever completed it. Mirrors family_hub/chores/approve on the
    websocket API - restricted the same way there (an admin, or a user
    granted chore-verification permission).
  fields:
    chore_id:
      name: Chore
      description: The chore's id.
      required: true
      selector:
        text:

reject_chore:
  name: Reject chore
  description: >-
    Send a pending-verification chore back to open instead of approving it -
    no stars disbursed, no streak change. Mirrors family_hub/chores/reject
    on the websocket API.
  fields:
    chore_id:
      name: Chore
      description: The chore's id.
      required: true
      selector:
        text:
    reason:
      name: Reason
      description: >-
        Optional free-text note explaining why (e.g. "the trash still had
        bags in it"), shown to whoever it's assigned to.
      required: false
      selector:
        text:

nudge_user:
  name: Nudge user about a chore
  description: >-
    Send a one-click reminder notification about a single active chore.
    Mirrors family_hub/chores/nudge on the websocket API.
  fields:
    chore_id:
      name: Chore
      description: The chore's id.
      required: true
      selector:
        text:
start_timer:
  name: Start a timer
  description: >-
    Start a Family Hub timer (the same kind as the Active Timers card's
    quick timer). When it ends it rings on the screens, phones and speakers
    it should, until someone taps Stop.
  fields:
    label:
      name: Label
      description: What the timer is for.
      required: false
      example: Pizza
      selector:
        text:
    hours:
      name: Hours
      required: false
      selector:
        number:
          min: 0
          max: 24
          mode: box
    minutes:
      name: Minutes
      required: false
      example: 12
      selector:
        number:
          min: 0
          max: 1440
          mode: box
    seconds:
      name: Seconds
      required: false
      selector:
        number:
          min: 0
          max: 59
          mode: box
    user:
      name: For
      description: A Home Assistant user id or a person's name. Leave empty for a house timer.
      required: false
      selector:
        text:
    alarm_audience:
      name: Who hears the alarm
      description: >-
        self - that person's screens, phones and linked speakers (or, for a
        house timer, the house speakers); kiosks - also the kiosk screens and
        house speakers; everyone - every screen, phone and speaker.
      required: false
      default: self
      selector:
        select:
          options:
            - self
            - kiosks
            - everyone
    speakers:
      name: Speakers
      description: Ring on just these registered alarm speakers instead.
      required: false
      selector:
        entity:
          multiple: true
          domain:
            - media_player
            - assist_satellite
cancel_timer:
  name: Cancel a timer
  description: >-
    Stop running Family Hub timer(s) without them going off - by id, or
    every timer for a person and/or with a label.
  fields:
    uid:
      name: Timer id
      required: false
      selector:
        text:
    user:
      name: For
      description: A Home Assistant user id or a person's name.
      required: false
      selector:
        text:
    label:
      name: Label
      required: false
      selector:
        text:
stop_timer_alarm:
  name: Stop a ringing timer alarm
  description: >-
    Silence a ringing Family Hub timer alarm everywhere (screens, phones,
    speakers). Without an id, stops every ringing alarm.
  fields:
    uid:
      name: Timer id
      required: false
      selector:
        text:
adjust_balance:
  name: Adjust balance
  description: >-
    Add to or subtract from someone's star balance, with an optional reason
    for their history. For someone on real money the amount is in dollars.
  fields:
    user_id:
      name: User ID
      description: The person's Home Assistant user id.
      required: true
      selector:
        text:
    amount:
      name: Amount
      description: Positive to add, negative to subtract. Dollars for someone on real money, stars otherwise.
      required: true
      selector:
        number:
          min: -100000
          max: 100000
          step: 0.01
          mode: box
    reason:
      name: Reason
      description: Shown in their history.
      selector:
        text:
pay_out:
  name: Pay out balance
  description: >-
    Record money handed over against someone's balance (an IOU payment).
    Pays the whole balance unless an amount is given. Returns the amount
    paid and what's left.
  fields:
    user_id:
      name: User ID
      description: The person's Home Assistant user id.
      required: true
      selector:
        text:
    amount:
      name: Amount
      description: Optional. Dollars for someone on real money, stars otherwise. Leave out to pay everything owed.
      selector:
        number:
          min: 0.01
          max: 100000
          step: 0.01
          mode: box
    reason:
      name: Reason
      description: Shown in their history, e.g. "FamZoo transfer". Defaults to "Paid out".
      selector:
        text:
